# bacon watches the crate and restarts the binary on a change. `.env` is watched
# too, so config edits reload the same way code does.
default_job = "run"

[jobs.run]
command = ["cargo", "run", "--color", "always"]
need_stdout = true
background = true
on_change_strategy = "kill_then_restart"
watch = [".env"]

[jobs.check]
command = ["cargo", "clippy", "--all-targets", "--color", "always", "--", "-D", "warnings"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--color", "always"]
need_stdout = true
