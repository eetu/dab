# Build and push ghcr.io/eetu/dab for linux/arm64 — the Pi's image.
#
# A push to main rebuilds only when something that goes into the image changed;
# a v* tag and a manual dispatch always build. Keep the dispatch: it is how a
# Dockerfile change is tried on a branch before it lands on main. Dispatching on
# a branch leaves a `:<branch>` tag, which the untagged-only prune never
# collects — delete those by hand.
#
# Actions are pinned to full commit SHAs with the version beside them.
name: Create and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            image:
              - "Dockerfile"
              - ".dockerignore"
              - "backend/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "core/**"
              - "frontend/**"
              - "package.json"
              - "yarn.lock"
              - ".yarnrc.yml"
              - ".yarn/releases/**"
              - ".github/workflows/dockerimage.yaml"

  build-and-push:
    needs: changes
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dab
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          # Provenance and SBOM each become a GHCR "version" of their own, which
          # only inflates the count on a single-platform image.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: dab
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 5
