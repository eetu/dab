# What `just check` runs, split by what changed: core, cli and the frontend (the
# yarn workspace) and the backend (the Rust workspace) are filtered apart, so a
# Rust-only change skips the JS half and the other way round.
#
# Branch protection requires `ci-gate` alone — never a filtered job by name: a
# skipped required check strands a PR at "waiting for status" forever.
#
# Actions are pinned to full commit SHAs with the version beside them; rolling
# selectors (dtolnay/rust-toolchain@stable) stay on the tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Prettier checks the whole repo, so any file it formats is the JS
          # side's business too.
          filters: |
            js:
              - "core/**"
              - "frontend/**"
              - "cli/**"
              - "schema/**"
              - "package.json"
              - "yarn.lock"
              - ".yarnrc.yml"
              - ".yarn/releases/**"
              - ".prettierrc"
              - "**/*.md"
              - "**/*.json"
              - "**/*.yaml"
              - "**/*.yml"
            rust:
              - "backend/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - ".github/workflows/ci.yaml"

  core:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # The vendored yarn, run by node — no corepack, the same as the Dockerfile.
      - run: node .yarn/releases/yarn-*.cjs install --immutable
      - name: Format (the whole repo)
        run: node .yarn/releases/yarn-*.cjs format
      - name: Lint
        run: node .yarn/releases/yarn-*.cjs workspace dab-core lint
      - name: Typecheck
        run: node .yarn/releases/yarn-*.cjs workspace dab-core typecheck
      - name: Test
        run: node .yarn/releases/yarn-*.cjs workspace dab-core test
      # Private, but a type error in what a consumer would build should fail
      # here.
      - name: Build
        run: node .yarn/releases/yarn-*.cjs workspace dab-core build

  # The local `dab` over a sprite folder: node tests against a temp folder,
  # driven through a real MCP client.
  cli:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node .yarn/releases/yarn-*.cjs install --immutable
      - name: Lint
        run: node .yarn/releases/yarn-*.cjs workspace dab-cli lint
      - name: Typecheck
        run: node .yarn/releases/yarn-*.cjs workspace dab-cli typecheck
      - name: Test
        run: node .yarn/releases/yarn-*.cjs workspace dab-cli test
      - name: Build
        run: node .yarn/releases/yarn-*.cjs workspace dab-cli build

  frontend:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
      - run: node .yarn/releases/yarn-*.cjs install --immutable
      - name: Lint
        run: node .yarn/releases/yarn-*.cjs workspace dab-frontend lint
      - name: Typecheck
        run: node .yarn/releases/yarn-*.cjs workspace dab-frontend typecheck
      # The suite runs in a real Chromium. One file at a time and one viewport,
      # set in the config — a two-core runner fails parallel browser suites
      # while a module is still being fetched. Don't undo either for speed.
      - name: Browser
        run: node .yarn/releases/yarn-*.cjs workspace dab-frontend exec playwright install --with-deps chromium
      - name: Test
        run: node .yarn/releases/yarn-*.cjs workspace dab-frontend test
      - name: Build
        run: node .yarn/releases/yarn-*.cjs workspace dab-frontend build

  backend:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo build --workspace --release

  # The one check branch protection requires. Runs whatever happened above, and
  # fails only if a job that ran failed or was cancelled — skipped is fine.
  ci-gate:
    if: always()
    needs: [changes, core, cli, frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: No job failed
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
