# dab's Rust workspace. One member: the backend, which serves the built SPA and
# nothing else — the editor reaches the disk through the browser's File System
# Access API, so there is no server-side store to build.
[workspace]
members = ["backend"]
resolver = "3"

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[profile.release]
lto = true
strip = true
